<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Land It. Scooter and skateboard trick tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
--ink:#12100B;--ink-2:#3A352C;--ink-3:#6E665A;
--paper:#FFFDF5;--paper-2:#FFF7E4;--wash:#F2ECDC;
--pink:#FF3D78;--orange:#FF5A1F;--yellow:#FFC23F;--lime:#9CE05B;--green:#10A06A;--mint:#2EC4B6;--sky:#3AC0FF;--blue:#246BFF;--violet:#8A3BE0;--red:#E0392B;
--street:#FF5A1F;--park:#246BFF;--flat:#10A06A;--hybrid:#8A3BE0;--air:#E0392B;
--fd:'Anton',Impact,sans-serif;--fc:'Barlow Condensed',sans-serif;--fb:'Archivo',system-ui,sans-serif;
--bd:3px solid var(--ink);--sh:5px 5px 0 var(--ink);--sh-sm:3px 3px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--wash);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#root{min-height:100vh}
a{color:var(--orange);text-decoration:none}
a:hover{color:var(--pink)}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--yellow)}
h1,h2,h3,h4{margin:0}
input,textarea,select{font:inherit}

/* type */
.d{font-family:var(--fd);text-transform:uppercase;letter-spacing:.01em;line-height:.92;font-weight:400}
.lab{font-family:var(--fc);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:11px}
.cond{font-family:var(--fc);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* app frame */
.app{min-height:100vh;display:flex;flex-direction:column;background:var(--wash);background-image:radial-gradient(rgba(18,16,11,.07) 1.1px,transparent 1.1px);background-size:14px 14px}
.topbar{position:sticky;top:0;z-index:60;background:var(--ink);color:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0}
.logo .glyph{width:30px;height:30px;background:var(--yellow);border:2.5px solid var(--paper);display:grid;place-items:center;transform:rotate(-5deg);flex:none}
.logo .glyph svg{width:19px;height:19px}
.logo .wm{font-family:var(--fd);font-size:22px;text-transform:uppercase;letter-spacing:.02em;color:var(--paper)}
.logo .wm em{font-style:normal;color:var(--yellow)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{font-family:var(--fc);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;background:none;border:2px solid transparent;color:#C9C2B4;padding:6px 12px;border-radius:2px;transition:.15s}
.nav button:hover{color:var(--paper);background:#2a2620}
.nav button.on{background:var(--yellow);color:var(--ink);border-color:var(--paper)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.streakchip{display:flex;align-items:center;gap:6px;font-family:var(--fc);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--yellow);background:#231f19;padding:5px 11px;border:2px solid #3a352c}
.avatarbtn{width:34px;height:34px;border:2.5px solid var(--paper);background:var(--pink);display:grid;place-items:center;font-family:var(--fd);font-size:15px;color:var(--paper);padding:0;flex:none}

.page{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:26px 18px 120px}
.mobnav{display:none}
.filter-toggle{display:none}

/* generic bits */
.btn{font-family:var(--fc);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;background:var(--orange);color:#fff;border:var(--bd);box-shadow:var(--sh-sm);padding:10px 20px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.sm{font-size:13px;padding:7px 14px;box-shadow:2px 2px 0 var(--ink)}
.btn.wide{width:100%;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
.panel{background:var(--paper);border:var(--bd);box-shadow:var(--sh);position:relative}
.panel.flat{box-shadow:var(--sh-sm)}
.tag{font-family:var(--fc);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#fff;border:2px solid var(--ink);box-shadow:1.5px 1.5px 0 var(--ink);padding:2.5px 8px;display:inline-block;white-space:nowrap}
.tag.tilt{transform:rotate(2.5deg)}
.pill{font-family:var(--fc);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase;border:2.5px solid var(--ink);background:var(--paper);padding:7px 14px;transition:.12s;white-space:nowrap}
.pill:hover{background:var(--paper-2)}
.pill.on{background:var(--ink);color:var(--paper)}
.eyebrow{font-family:var(--fc);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
.sechead{display:flex;align-items:flex-end;gap:14px;margin:0 0 14px}
.sechead h2{font-family:var(--fd);font-size:clamp(22px,3vw,30px);text-transform:uppercase}
.sechead .rule{flex:1;height:3px;background:var(--ink);margin-bottom:7px}
.sechead .more{font-family:var(--fc);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;padding:0;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.sechead .more:hover{color:var(--orange)}

/* difficulty bars */
.diff{display:flex;gap:3px;align-items:center}
.diff i{width:13px;height:10px;display:block;background:rgba(255,255,255,.7);border:2px solid var(--ink);transform:skewX(-16deg)}
.diff i.on{background:var(--ink)}
.diff.sm i{width:9px;height:8px;border-width:1.5px}

/* photo placeholder */
.slot{border:2.5px dashed var(--ink-3);background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 14px,rgba(18,16,11,.045) 14px 17px);display:grid;place-items:center;position:relative;min-height:90px}
.slot span{font-family:var(--fc);font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:6px}

/* trick card */
.tcard{border:var(--bd);box-shadow:var(--sh-sm);background:var(--paper);padding:0;text-align:left;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .13s,box-shadow .13s;width:100%}
.tcard:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tcard .fold{position:absolute;top:0;right:0;border-width:0 26px 26px 0;border-style:solid;border-color:transparent var(--c) transparent transparent}
.tcard .body{padding:13px 14px 12px;display:flex;flex-direction:column;gap:9px;flex:1}
.tcard .nm{font-family:var(--fd);font-size:21px;text-transform:uppercase;line-height:.95;padding-right:26px}
.tcard .meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tcard .foot{border-top:2.5px solid var(--ink);padding:8px 14px;display:flex;align-items:center;gap:8px;font-family:var(--fc);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin-top:auto}
.dot{width:11px;height:11px;border:2px solid var(--ink);border-radius:50%;flex:none;display:block}

/* sport tabs */
.sporttabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.sporttab{display:flex;align-items:center;gap:8px;font-family:var(--fc);font-weight:700;font-size:14px;letter-spacing:.09em;text-transform:uppercase;border:3px solid var(--ink);background:var(--paper);box-shadow:var(--sh-sm);padding:9px 16px;transition:.12s}
.sporttab:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.sporttab .n{font-family:var(--fc);font-size:12px;letter-spacing:.06em;opacity:.75}
.sporttab.on{box-shadow:4px 4px 0 var(--ink)}
.sportchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--fc);font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:2px solid;padding:2px 7px;background:var(--paper);white-space:nowrap;align-self:flex-start}

/* locked trick */
.tcard.lockd{background:repeating-linear-gradient(45deg,#F1EBDC 0 9px,#E9E2D1 9px 18px)!important;box-shadow:2px 2px 0 var(--ink)}
.tcard.lockd .nm,.tcard.lockd .body{color:var(--ink-3)}
.tcard.lockd:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.lockflag{position:absolute;top:9px;right:9px;z-index:2;display:flex;align-items:center;gap:5px;font-family:var(--fc);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--violet);color:#fff;border:2px solid var(--ink);padding:2px 7px}

/* grids */
.grid-tricks{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.two-col{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}

/* stage selector */
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.stagebtn{border:2.5px solid var(--ink);background:var(--paper);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--fc);font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;transition:.12s;line-height:1.1;text-align:center}
.stagebtn:hover{background:var(--paper-2);transform:translateY(-2px)}
.stagebtn .ring{width:18px;height:18px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper)}
.stagebtn.on{color:#fff;box-shadow:3px 3px 0 var(--ink)}
.stagebtn.on .ring{background:#fff}

/* sticker */
.sticker{position:relative;aspect-ratio:1;border:none;background:transparent;padding:0;filter:drop-shadow(0 4px 5px rgba(18,16,11,.35));transition:transform .15s}
.sticker:hover{transform:rotate(-3deg) scale(1.04)}
.sticker svg{display:block;width:100%}
.sticker.locked{filter:saturate(.8) drop-shadow(0 3px 4px rgba(18,16,11,.28))}
.sticker.locked:hover{transform:none}
.sticker.just{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}

/* progress bar */
.bar{height:16px;border:2.5px solid var(--ink);background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);transition:width .5s cubic-bezier(.2,.9,.3,1)}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--fc);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea{border:2.5px solid var(--ink);background:var(--paper);padding:11px 13px;font-size:15px;font-family:var(--fb);outline:none;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{box-shadow:3px 3px 0 var(--yellow)}
.field .err{font-family:var(--fc);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--red)}
.search{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);background:var(--paper);box-shadow:var(--sh-sm);padding:11px 14px}
.search input{border:none;outline:none;background:none;font-size:16px;flex:1;font-family:var(--fb);min-width:0}
.search svg{width:19px;height:19px;flex:none}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--paper);border:3px solid var(--paper);box-shadow:0 6px 0 rgba(18,16,11,.35);padding:11px 16px;display:flex;align-items:center;gap:11px;font-family:var(--fc);font-weight:700;font-size:14.5px;letter-spacing:.05em;text-transform:uppercase;animation:tin .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes tin{from{transform:translateY(24px) scale(.9);opacity:0}}
.toast .chip{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);flex:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,16,11,.72);z-index:180;display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border:4px solid var(--ink);box-shadow:0 14px 0 rgba(18,16,11,.4);width:min(520px,100%);max-height:88vh;overflow:auto;animation:mup .25s cubic-bezier(.2,1.3,.4,1)}
@keyframes mup{from{transform:translateY(26px) scale(.96);opacity:0}}

/* admin tables */
.arow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:11px 16px}
.arow>*{flex:1 1 90px;min-width:0}
.arow>*:first-child{flex:2 1 170px}
.arow>*:last-child{flex:0 0 auto}
.arow select{border-radius:0}

/* skill tree */
.tree{display:flex;flex-direction:column;gap:26px}
.branch{border:var(--bd);box-shadow:var(--sh-sm);background:var(--paper);padding:16px}
.tier-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.node{border:2.5px solid var(--ink);padding:10px 11px;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:6px;transition:.13s;position:relative}
.node:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.node .nn{font-family:var(--fd);font-size:15px;text-transform:uppercase;line-height:1}
.node.lock{background:repeating-linear-gradient(45deg,#EFE9DA 0 8px,#E7E0CF 8px 16px);color:var(--ink-3);border-style:dashed}
.node.lock:hover{transform:none;box-shadow:none}
.node.done{background:var(--lime)}
.node.paid{background:repeating-linear-gradient(45deg,#F1EBDC 0 8px,#E9E2D1 8px 16px);border-style:dashed;border-color:var(--violet);color:var(--ink-3)}

@media(max-width:860px){
  .two-col{grid-template-columns:1fr}
  .filter-toggle{display:flex;width:100%;align-items:center;gap:9px;border:var(--bd);box-shadow:var(--sh-sm);background:var(--paper);padding:12px 14px;font-family:var(--fc);font-weight:700;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin-bottom:14px}
  .filter-toggle .fcount{background:var(--pink);color:#fff;border:2px solid var(--ink);padding:1px 7px;font-size:11px}
  .filterwrap{display:none;margin-bottom:16px}
  .filterwrap.open{display:block}
  .nav{display:none}
  .page{padding:18px 14px 108px}
  .mobnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--ink);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
  .mobnav button{background:none;border:none;padding:10px 2px 13px;min-height:52px;justify-content:center;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9d968a;font-family:var(--fc);font-weight:700;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
  .mobnav button svg{width:21px;height:21px}
  .mobnav button.on{color:var(--yellow)}
  .grid-tricks{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .stages{grid-template-columns:repeat(5,1fr);gap:4px}
  .stagebtn{font-size:9.5px;padding:8px 3px;letter-spacing:.02em}
  .topbar-in{padding:9px 14px;gap:12px}
  .logo .wm{font-size:19px}
}
@media(max-width:520px){
  .grid-tricks{grid-template-columns:1fr 1fr}
  .sporttab{flex:1;justify-content:center;padding:9px 10px;font-size:13px}
  .tcard .nm{font-size:17px}
  .streakchip{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="landit-data.js"></script>

<script type="text/babel" src="landit-screens-a.jsx"></script>
<script type="text/babel" src="landit-screens-b.jsx"></script>
<script type="text/babel" src="landit-screens-c.jsx"></script>
<script type="text/babel" src="landit-screens-d.jsx"></script>
<script type="text/babel" src="landit-admin.jsx"></script>
<script type="text/babel" src="landit-app.jsx"></script>
</body>
</html>
