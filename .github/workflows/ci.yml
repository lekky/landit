name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI honest about what it is: no telemetry, no interactive prompts.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  gates:
    name: build · test · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm test` starts a real PocketBase and drives it over HTTP to prove the
      # four security guarantees (plan §3). The binary is pinned by
      # `pocketbase/pocketbase.version`; caching it keeps the run off GitHub's
      # release downloads on every push, and the version is the cache key so an
      # upgrade fetches a fresh one.
      - name: Cache the pinned PocketBase binary
        uses: actions/cache@v4
        with:
          path: pocketbase/.bin
          key: pocketbase-${{ runner.os }}-${{ hashFiles('pocketbase/pocketbase.version') }}

      # Each gate is its own step so a failure names itself. They are judged on
      # exit codes — never pipe them.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

  # Coolify deploys these two images from this repo, so a Dockerfile that does
  # not build is a failed deploy on a box that also carries other products. This
  # job is the only place that is proven — nobody builds them by hand, and the
  # machines that write them may have no Docker at all.
  #
  # Built, never pushed. There is no registry: Coolify builds from source on the
  # box. What this proves is that the build succeeds and the artefacts land where
  # the runtime stage expects them.
  images:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          # Loaded into the daemon, because the next step runs it. A built image
          # is not a working one — that distinction cost two failed deploys.
          load: true
          tags: landit-web:ci
          # The browser bundle inlines this at build time, so the build has to be
          # given one. The value is irrelevant to whether it compiles; that it is
          # *required* is the thing worth not discovering on the box.
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=https://api.landthetrick.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gap this closes: `docker build` proves an image builds. It says
      # nothing about whether `node server.js` finds its modules, which is a
      # runtime question and was answered — twice — by a crash loop on the box
      # rather than by CI. Starting it and asking for a page is the whole test.
      #
      # `LANDIT_SITE_LIVE=true` because this step's job is to prove the *app*
      # serves. Without it the pre-launch gate would answer with the holding
      # page — also a 200, so the old status-code-only check would have passed
      # while proving nothing about the landing page.
      - name: Web app starts and serves
        run: |
          docker run -d --name landit-web-ci -p 3000:3000 \
            -e LANDIT_SITE_LIVE=true landit-web:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = "200" ] && echo "served 200 after ${i}s" && served=1 && break
            sleep 1
          done
          if [ "$served" != "1" ]; then
            echo "::error::the web image never served a 200"
            docker logs landit-web-ci
            exit 1
          fi
          curl -s http://localhost:3000/ | grep -q 'Every trick' || {
            echo "::error::200, but that is not the landing page"
            docker logs landit-web-ci; exit 1;
          }

      # The gate, on the real production image, both ways round.
      #
      # Two things are being proven and neither is provable in `pnpm dev`:
      # that an **unset** flag in a production build holds the site shut, and
      # that the flag is read at **runtime** rather than inlined at build time.
      # The image under test is byte-for-byte the one the step above just ran
      # with the flag on — same build, opposite behaviour, so the only thing
      # that can have changed the answer is the environment. That is the
      # `NEXT_PUBLIC_*` trap from LESSONS §6 being tested for, not assumed away.
      - name: The pre-launch gate holds the site shut
        run: |
          docker rm -f landit-web-ci > /dev/null 2>&1 || true
          docker run -d --name landit-web-gate -p 3001:3000 landit-web:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ || true)
            [ "$code" = "200" ] && served=1 && break
            sleep 1
          done
          # A 200, not a 503: Uptime Kuma watches this URL and the gate must not
          # read as an outage (docs/infrastructure.md).
          if [ "$served" != "1" ]; then
            echo "::error::the gated site never served a 200"
            docker logs landit-web-gate
            exit 1
          fi
          body=$(curl -s http://localhost:3001/)
          echo "$body" | grep -q 'just yet' || {
            echo "::error::the flag was unset and the site served something other than the holding page"
            docker logs landit-web-gate; exit 1;
          }
          echo "$body" | grep -q 'Every trick' && {
            echo "::error::the landing page leaked through the gate"
            exit 1;
          }
          # Sign-up is the thing that actually matters: a real child could make a
          # real account here. It must not render while the gate is shut.
          echo "gated /signup: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/signup)"
          curl -s http://localhost:3001/signup | grep -q 'just yet' || {
            echo "::error::/signup was reachable behind the gate"; exit 1;
          }
          # And crawlers are told to stay out, per app/robots.ts.
          curl -s http://localhost:3001/robots.txt | grep -qi 'Disallow: /' || {
            echo "::error::robots.txt did not disallow while the gate was shut"
            curl -s http://localhost:3001/robots.txt; exit 1;
          }
          echo "gate shut: holding page served, /signup covered, crawlers disallowed"

      - name: PocketBase
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pocketbase/Dockerfile
          load: true
          tags: landit-pocketbase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Also proves the migrations run: PocketBase applies them at boot, and a
      # migration that throws leaves the API up but the schema empty, so the
      # collection check is the part that matters (LESSONS §5).
      - name: PocketBase starts, migrates and serves
        run: |
          docker run -d --name landit-pb-ci -p 8090:8090 landit-pocketbase:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          curl -sf http://localhost:8090/api/health > /dev/null || {
            echo "::error::PocketBase never became healthy"; docker logs landit-pb-ci; exit 1;
          }
          curl -sf "http://localhost:8090/api/collections/tricks/records?perPage=1" > /dev/null || {
            echo "::error::the tricks collection is missing — migrations did not run"
            docker logs landit-pb-ci; exit 1;
          }
          echo "healthy, and the schema is there"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Since T6 the suite signs riders up, so Playwright starts a PocketBase
      # alongside the web server (`playwright.config.ts`). Same cache and same
      # key as the gates job: the version is the key, so an upgrade fetches a
      # fresh binary and nothing else does.
      - name: Cache the pinned PocketBase binary
        uses: actions/cache@v4
        with:
          path: pocketbase/.bin
          key: pocketbase-${{ runner.os }}-${{ hashFiles('pocketbase/pocketbase.version') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # "I rode today" writes the server-owned streak tuple through the
      # superuser client (plan §7, T8), so the web server the suite starts needs
      # credentials or the button fails softly and its tests fail with it. These
      # are the same throwaway fixture pair `pocketbase/tests/instance.ts` and
      # `e2e/support/seed-library.ts` provision in the scratch database — not a
      # secret, and deliberately not the ones any real instance uses.
      - name: Playwright
        run: pnpm e2e
        env:
          POCKETBASE_SUPERUSER_EMAIL: test-superuser@landit.invalid
          POCKETBASE_SUPERUSER_PASSWORD: a-long-local-test-password

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
